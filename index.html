<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Aida & Geovanny</title>
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Great Vibes para el texto cursivo, Montserrat para el texto limpio -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Capa superpuesta para hacer el texto legible sobre el fondo de rosas -->
    <div class="overlay"></div>

    <div class="container">
        <!-- Título Principal -->
        <div class="title-container">
            <h1 class="script-text save animate-up delay-1">Save</h1>
            <h1 class="script-text the animate-up delay-2">the</h1>
            <h1 class="script-text date animate-up delay-3">date</h1>
        </div>

        <!-- Mes y Año -->
        <div class="month-year animate-up delay-4">
            ENERO &bull; 2027
        </div>

        <!-- Calendario Enero 2027 -->
        <div class="calendar animate-up delay-5">
            <!-- Días de la semana -->
            <div class="day-head">DO</div>
            <div class="day-head">LU</div>
            <div class="day-head">MA</div>
            <div class="day-head">MI</div>
            <div class="day-head">JU</div>
            <div class="day-head">VI</div>
            <div class="day-head">SA</div>

            <!-- Espacios vacíos (Enero 2027 empieza en Viernes) -->
            <div></div><div></div><div></div><div></div><div></div>
            
            <!-- Días del mes -->
            <div class="day">1</div>
            <div class="day">2</div>
            <div class="day">3</div>
            <div class="day">4</div>
            <div class="day">5</div>
            <div class="day">6</div>
            <div class="day">7</div>
            <div class="day">8</div>
            <div class="day">9</div>
            <div class="day">10</div>
            <div class="day">11</div>
            <div class="day">12</div>
            <div class="day">13</div>
            <div class="day">14</div>
            <div class="day">15</div>
            <div class="day">16</div>
            <div class="day">17</div>
            <div class="day">18</div>
            <div class="day">19</div>
            <div class="day">20</div>
            <div class="day">21</div>
            <div class="day">22</div>
            <!-- Día del evento -->
            <div class="day heart-day">
                <svg viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z" fill="#111"/>
                </svg>
                <span>23</span>
            </div>
            <div class="day">24</div>
            <div class="day">25</div>
            <div class="day">26</div>
            <div class="day">27</div>
            <div class="day">28</div>
            <div class="day">29</div>
            <div class="day">30</div>
            <div class="day">31</div>
        </div>

        <!-- Nombres -->
        <h2 class="names animate-up delay-6">Aida & Geovanny</h2>

        <!-- Footer -->
        <div class="footer animate-up delay-7">
            INVITACIÓN FORMAL PRÓXIMAMENTE
        </div>

        <div class="details animate-up delay-8">
            CEREMONIA 1 PM - PARROQUIA DE SAN GABRIEL<br>
            RECEPCIÓN 5 PM - VILLA REAL SALÓN Y JARDÍN
        </div>

        <!-- Botón -->
        <div class="animate-up delay-9">
            <button id="addToCalendarBtn" class="btn">
                GUARDAR EN CALENDARIO
            </button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
